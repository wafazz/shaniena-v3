; Queue worker.
;
; Everything slow is queued: order confirmation mail, courier bookings, the
; three scheduled jobs. With no worker running the shop still takes orders and
; nobody is ever told about them, which is why `shaniena:preflight` checks the
; queue backend and why this is a supervised program rather than a nohup.
;
; Install as /etc/supervisor/conf.d/shaniena-worker.conf, then
;   supervisorctl reread && supervisorctl update

[program:shaniena-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/shaniena/current/artisan queue:work redis --queue=default --sleep=3 --tries=3 --max-time=3600 --backoff=10
directory=/var/www/shaniena/current
autostart=true
autorestart=true
; Workers hold the release they booted with in memory. deploy.sh restarts this
; program after the symlink flip; --max-time makes a missed restart self-heal
; within the hour instead of serving stale code forever.
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/shaniena-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

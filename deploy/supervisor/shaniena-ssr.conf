; Inertia SSR renderer.
;
; The storefront is server-rendered for SEO and first paint (the admin console
; is not — it is behind a login and indexed by nobody, so it is not in the SSR
; bundle). This is a node process listening on 127.0.0.1:13714; if it dies the
; site stays up and falls back to client rendering, so it is a ranking problem
; rather than an outage — which is exactly why nothing else notices and why
; preflight asks it for /health on every deploy.
;
; Install as /etc/supervisor/conf.d/shaniena-ssr.conf, then
;   supervisorctl reread && supervisorctl update

[program:shaniena-ssr]
command=node /var/www/shaniena/current/bootstrap/ssr/ssr.js
directory=/var/www/shaniena/current
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
environment=NODE_ENV="production"
redirect_stderr=true
stdout_logfile=/var/log/supervisor/shaniena-ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5

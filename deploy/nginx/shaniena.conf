# Shaniena storefront + admin console.
#
# Install as /etc/nginx/sites-available/shaniena, symlink into sites-enabled,
# then `nginx -t && systemctl reload nginx`. Certificates are issued by certbot
# (`certbot --nginx -d shaniena.com -d www.shaniena.com`), which rewrites the
# ssl_certificate lines below in place.

server {
    listen 80;
    listen [::]:80;
    server_name shaniena.com www.shaniena.com;

    # ACME renewal must survive the redirect.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name shaniena.com www.shaniena.com;

    ssl_certificate     /etc/letsencrypt/live/shaniena.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shaniena.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # `current` is a symlink; $realpath_root is what php-fpm must be given, or
    # opcache keeps serving the release before this one.
    root /var/www/shaniena/current/public;
    index index.php;

    charset utf-8;
    server_tokens off;

    # The largest upload the app accepts is 4 MB (mimes+max:4096 in the form
    # requests); the rest is multipart overhead. php.ini must not be lower:
    # upload_max_filesize = 8M, post_max_size = 8M.
    client_max_body_size 8m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Vite output is content-hashed, so it can never go stale.
    location /build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # The service worker is not hashed. Cached, it would pin customers to an
    # old worker across a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Product images and other uploads, served through the public/storage link.
    location /storage/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm-shaniena.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        # Gateway callbacks and courier bookings are outbound-blocking; the
        # default 60s is not enough when a courier API is slow.
        fastcgi_read_timeout 120;
    }

    # Nothing under public/ starts with a dot, and .env is a directory above.
    location ~ /\. { deny all; }

    access_log /var/log/nginx/shaniena.access.log;
    error_log  /var/log/nginx/shaniena.error.log;
}

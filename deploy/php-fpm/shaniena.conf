; Dedicated php-fpm pool for the shop.
;
; nginx passes to /run/php/php8.4-fpm-shaniena.sock, which is this pool and not
; Ubuntu's default `www` pool — a pool of our own means the shop's worker count
; and timeouts are tuned here rather than in a file the next `apt upgrade` may
; rewrite, and removing the default pool leaves nothing else listening.
;
; Install as /etc/php/8.4/fpm/pool.d/shaniena.conf, remove
; /etc/php/8.4/fpm/pool.d/www.conf, then `systemctl restart php8.4-fpm` and
; check the socket exists. Sizing below assumes the 4 GB droplet in
; docs/deployment.md; pm.max_children is what to raise on a bigger box.

[shaniena]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm-shaniena.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; ~40 MB of real memory per busy child against memory_limit = 256M. 20 children
; is the ceiling the box can serve without swapping while MySQL, Redis, two
; queue workers and the SSR node process hold their own memory.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
; Recycle children so a leak in a long-lived extension cannot accumulate.
pm.max_requests = 500

; nginx gives a request 120s (fastcgi_read_timeout) because gateway callbacks
; and courier bookings block on outbound calls. fpm must outlast that, or it
; kills the worker first and nginx reports 502 instead of the real timeout.
request_terminate_timeout = 130

; Without this, anything a child writes to stderr is discarded rather than
; logged — including the fatal that killed it.
catch_workers_output = yes
php_admin_value[error_log] = /var/log/php8.4-fpm-shaniena.log
php_admin_flag[log_errors] = on


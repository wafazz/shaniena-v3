<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>You're offline — Shaniena</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center;
               font-family: 'Montserrat', system-ui, sans-serif; color: #111; background: #fff; padding: 2rem; }
        .box { max-width: 26rem; text-align: center; }
        h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
        p { color: #5c5c5c; line-height: 1.6; }
        a { display: inline-block; margin-top: 1.5rem; background: #ca1515; color: #fff;
            text-decoration: none; padding: .75rem 1.75rem; font-weight: 600; letter-spacing: .04em; }
    </style>
</head>
<body>
    <div class="box">
        <h1>You're offline</h1>
        <p>We can't reach the shop right now. Check your connection and try again — anything already in your cart is saved.</p>
        <a href="/">Try again</a>
    </div>
</body>
</html>
